<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Адмінка — Crystal Christmas</title><link rel="stylesheet" href="style.css"></head><body><header><a class="brand" href="index.html">✦ Crystal Christmas</a><nav><a href="index.html">До магазину</a><button id="logout" hidden>Вийти</button></nav></header><main class="admin-layout"><h1>Панель керування</h1><p id="status"></p><section id="loginSection" class="panel"><h2>Вхід адміністратора</h2><form id="loginForm"><input type="email" name="email" placeholder="Email" required><input type="password" name="password" placeholder="Пароль" required><button type="submit">Увійти</button></form></section><div id="dashboard" hidden><section class="panel"><h2>Додати / змінити іграшку</h2><form id="productForm"><input name="name" placeholder="Назва іграшки" required><input name="price" type="number" min="0" step="0.01" placeholder="Ціна, грн" required><textarea name="description" placeholder="Опис"></textarea><label>Додати декілька фото (до 8 МБ кожне)</label><input name="images" type="file" accept="image/*" multiple><div id="photoPreview" class="preview"></div><button type="submit">Зберегти товар</button><button id="cancelEdit" type="button">Скасувати редагування</button></form></section><section class="panel"><h2>Товари</h2><div id="adminProducts" class="admin-list"></div></section><section class="panel"><h2>Замовлення</h2><div id="orders" class="admin-list"></div></section></div></main><script type="module" src="admin.js"></script></body></html>
